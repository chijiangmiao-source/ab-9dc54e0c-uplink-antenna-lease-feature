services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satctl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satctl}
      POSTGRES_DB: ${POSTGRES_DB:-satctl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satctl} -d ${POSTGRES_DB:-satctl}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-satctl}:${POSTGRES_PASSWORD:-satctl}@db:5432/${POSTGRES_DB:-satctl}
    ports:
      # Host port is overridable through API_PORT.
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot acceptance service: runs pytest against the real API and the
  # real PostgreSQL, then exits. Never restarts (exit code is the verdict).
  verify:
    build:
      context: .
      target: verify
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-satctl}:${POSTGRES_PASSWORD:-satctl}@db:5432/${POSTGRES_DB:-satctl}
      API_BASE_URL: http://api:8000
    restart: "no"

volumes:
  pgdata:
